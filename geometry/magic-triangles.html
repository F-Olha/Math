const BASE=[[3,4,5],[5,12,13],[8,15,17],[7,24,25]];

const sq=n=>{for(let i=Math.floor(Math.sqrt(n));i>1;i--)if(n%(i*i)==0)return{k:i,m:n/(i*i)};return{k:1,m:n}};

function draw(){const q=run.q,l=LV[run.i];let b;
if(q.opts)b=(q.svg||'')+`<div class="q">${q.q}</div>`+q.opts.map((o,k)=>`<button class="opt" data-k="${k}" onclick="pickOpt(${k})">${o}</button>`).join('');
else{const p=q.q.split('{}');b=q.svg+`<div class="q">${p.map((s,k)=>s+(k<p.length-1?`<input class="in" id="in${k}" data-i="${k}" autocomplete="off" inputmode="text" aria-label="відповідь ${k+1}">`:'')).join('')}</div><div class="row"><button class="btn" id="ck" onclick="check()">Перевірити</button><button class="sqrt" onclick="addRoot()" aria-label="вставити знак кореня">√</button><span class="mut">Корінь: кнопка √ або літера v. Приклад: 5√2</span></div>`}
$('app').innerHTML=`<div class="row" style="justify-content:space-between;margin:0"><button class="btn g" onclick="map()">← Карта</button><b>Рівень ${run.i+1}. ${l.n} · ${S.d?'середній':'простий'}</b></div>${dots()}<div class="card">${b}<div class="row" id="hb">${hintBtn()}</div><div class="hint" id="h" hidden></div><div id="fb"></div></div>`;
const ins=[...document.querySelectorAll('.in')];window._last=ins[0];if(ins[0])ins[0].focus();ins.forEach(x=>{x.addEventListener('focus',()=>window._last=x);x.addEventListener('keydown',e=>{if(e.key=='Enter')run.answered?next():check()})})}
function addRoot(){const x=window._last||document.querySelector('.in');if(!x)return;const s=x.selectionStart??x.value.length;x.value=x.value.slice(0,s)+'√'+x.value.slice(x.selectionEnd??s);x.focus();x.setSelectionRange(s+1,s+1)}
function verdict(ok,solution){if(run.answered)return;run.answered=true;let fb;
if(ok){run.done++;fb=`<div class="fb ok">✅ ${pick(['Чудово!','Так!','Влучно!','Саме так!'])}</div>`}
else{fb=`<div class="fb no">Нічого страшного. Ось як правильно:<br><b>${solution}</b><br><span class="mut">${run.q.hints[run.q.hints.length-1]}</span></div>`}
if(run.done>=GOAL)fb+=`<div class="row"><button class="btn" onclick="finish()">Рівень пройдено! 🎉</button></div>`;else fb+=`<div class="row"><button class="btn" onclick="next()">Далі →</button></div>`;
document.querySelector('.dots').outerHTML=dots();$('fb').innerHTML=fb;$('hb').innerHTML='';const b=$('ck');if(b)b.disabled=true;document.querySelectorAll('.opt').forEach(o=>{o.disabled=true})}
function pickOpt(k){if(run.answered)return;const q=run.q,ok=q.opts[k]==q.ok;document.querySelectorAll('.opt').forEach((o,j)=>{if(q.opts[j]==q.ok)o.classList.add('ok');else if(j==k)o.classList.add('no')});if(!ok)run.mist++;verdict(ok,q.sol)}
function check(){if(run.answered)return;const q=run.q,ins=[...document.querySelectorAll('.in')];
if(ins.some(x=>!x.value.trim())){$('fb').innerHTML='<div class="fb no">Заповніть усі пропуски.</div>';return}
const rs=ins.map((x,k)=>cmp(x.value,q.ans[k]));
if(rs.includes('bad')){$('fb').innerHTML='<div class="fb no">Запишіть число або число з коренем, наприклад 7 чи 5√2.</div>';return}
if(rs.includes('simp')){$('fb').innerHTML='<div class="fb no">Значення правильне, але корінь ще можна спростити: винесіть множник з-під кореня.</div>';return}
ins.forEach((x,k)=>{x.classList.remove('ok','no');x.classList.add(rs[k]=='ok'?'ok':'no')});
if(rs.every(r=>r=='ok'))return verdict(true);
run.tries++;if(run.tries==1){run.mist++;$('fb').innerHTML='<div class="fb no">Ще не те. Відкрийте підказку й спробуйте ще раз.</div>';return}
verdict(false,q.sol)}
function finish(){const i=run.i,s=run.mist==0?3:run.mist<=2?2:1,k=key(i);S.st[k]=Math.max(S.st[k]||0,s);save();
$('app').innerHTML=`<div class="card" style="text-align:center"><h2>Рівень пройдено!</h2><div class="stars">${star(s)}</div><p>${s==3?'Без жодної помилки!':'Помилок: '+run.mist+'. Пройдіть ще раз, щоб отримати більше зірок.'}</p><div class="row" style="justify-content:center">${i<LV.length-1?`<button class="btn" onclick="intro(${i+1})">Наступний рівень →</button>`:''}<button class="btn g" onclick="start(${i})">Ще раз</button><button class="btn g" onclick="map()">До карти</button></div></div>`}
map();
</script>

</body></html>
